name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Caagan
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#39d353&color_dots=#0e4429,#006d32,#26a641,#39d353,#39d353
            dist/github-contribution-grid-snake-dark.svg?color_snake=#39d353&color_dots=#0e4429,#006d32,#26a641,#39d353,#39d353

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
